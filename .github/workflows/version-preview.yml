name: Version Preview

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep 'version = "' pyproject.toml | head -1 | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Preview next version
        id: preview
        run: |
          CURRENT="${{ steps.current.outputs.version }}"

          # Analyze PR commit messages to determine version bump type.
          # In a PR checkout, origin/main..HEAD contains the PR commits.
          COMMITS=$(git log --format="%s" origin/main..HEAD 2>/dev/null || true)

          BUMP_TYPE=""
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            # Check for breaking change indicator
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP_TYPE="major"
              break
            fi

            # Check commit type prefix
            TYPE=$(echo "$msg" | sed -n 's/^\([a-z]*\)\(([^)]*)\)\?:.*/\1/p')
            case "$TYPE" in
              feat)
                [ "$BUMP_TYPE" != "major" ] && BUMP_TYPE="minor"
                ;;
              fix|perf)
                [ -z "$BUMP_TYPE" ] && BUMP_TYPE="patch"
                ;;
            esac
          done <<< "$COMMITS"

          if [ -n "$BUMP_TYPE" ]; then
            # Calculate next version
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)

            case "$BUMP_TYPE" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac

            echo "next_version=$NEXT" >> $GITHUB_OUTPUT
            echo "will_bump=true" >> $GITHUB_OUTPUT
            echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          else
            echo "will_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const currentVersion = '${{ steps.current.outputs.version }}';
            const willBump = '${{ steps.preview.outputs.will_bump }}' === 'true';
            const nextVersion = '${{ steps.preview.outputs.next_version }}';
            const bumpType = '${{ steps.preview.outputs.bump_type }}';

            const commentIdentifier = '<!-- version-preview-bot -->';

            let body;
            if (willBump) {
              body = `${commentIdentifier}
            ## Version Preview

            | Current | → | Next | Bump Type |
            |---------|---|------|-----------|
            | \`v${currentVersion}\` | → | \`v${nextVersion}\` | **${bumpType}** |

            This version will be released automatically when this PR is merged.`;
            } else {
              body = `${commentIdentifier}
            ## Version Preview

            | Current Version |
            |-----------------|
            | \`v${currentVersion}\` |

            [!] No version bump detected. This PR doesn't contain commits that trigger a release (e.g., \`feat:\`, \`fix:\`, \`perf:\`).`;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
