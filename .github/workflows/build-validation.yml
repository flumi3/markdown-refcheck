name: Build Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  pull_request_target:
    types: [edited]
    branches: [main]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen

      - name: Get current PR title dynamically
        id: pr_title
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title)
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "Fetched PR #${{ github.event.pull_request.number }} title: $PR_TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PR title with Commitizen
        run: |
          cz check --message "${{ steps.pr_title.outputs.title }}" || 
          (echo "Invalid PR title! Use Conventional Commit format (e.g., 'feat: add X'). Refer to CONTRIBUTING.md for guidelines." && exit 1)

  validate-commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen

      - name: Check all commits in PR
        run: |
          echo "Checking all commits in PR..."
          cz check --rev-range origin/main..HEAD || 
          (echo "Some commits don't follow Conventional Commit format! Refer to CONTRIBUTING.md for guidelines." && exit 1)

  # Explicit job definitions for each Python version (matrix not supported on reusable workflows)
  docs-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Docs QA
        run: make docs-qa-check

  test-py310:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      python-version: "3.10"
    secrets: inherit

  test-py311:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      python-version: "3.11"
    secrets: inherit

  test-py312:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      python-version: "3.12"
    secrets: inherit

  test-py313:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      python-version: "3.13"
    secrets: inherit
