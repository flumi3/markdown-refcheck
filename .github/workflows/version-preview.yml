name: Version Preview

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep 'version = "' pyproject.toml | head -1 | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Preview next version
        id: preview
        run: |
          # Get the next version using semantic-release
          semantic-release version --print > version_output.txt 2>&1 || true
          cat version_output.txt

          # Check if a new version would be released
          if grep -q "The next version is:" version_output.txt; then
            NEXT=$(grep "The next version is:" version_output.txt | sed 's/.*The next version is: //')
            echo "next_version=$NEXT" >> $GITHUB_OUTPUT
            echo "will_bump=true" >> $GITHUB_OUTPUT
            
            # Determine bump type by comparing versions
            CURRENT="${{ steps.current.outputs.version }}"
            CURRENT_MAJOR=$(echo $CURRENT | cut -d. -f1)
            CURRENT_MINOR=$(echo $CURRENT | cut -d. -f2)
            CURRENT_PATCH=$(echo $CURRENT | cut -d. -f3)
            
            NEXT_MAJOR=$(echo $NEXT | cut -d. -f1)
            NEXT_MINOR=$(echo $NEXT | cut -d. -f2)
            NEXT_PATCH=$(echo $NEXT | cut -d. -f3)
            
            if [ "$NEXT_MAJOR" -gt "$CURRENT_MAJOR" ]; then
              BUMP_TYPE="major"
            elif [ "$NEXT_MINOR" -gt "$CURRENT_MINOR" ]; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
            
            echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          else
            echo "will_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const currentVersion = '${{ steps.current.outputs.version }}';
            const willBump = '${{ steps.preview.outputs.will_bump }}' === 'true';
            const nextVersion = '${{ steps.preview.outputs.next_version }}';
            const bumpType = '${{ steps.preview.outputs.bump_type }}';

            const commentIdentifier = '<!-- version-preview-bot -->';

            let body;
            if (willBump) {
              body = `${commentIdentifier}
            ## Version Preview

            | Current | → | Next | Bump Type |
            |---------|---|------|-----------|
            | \`v${currentVersion}\` | → | \`v${nextVersion}\` | **${bumpType}** |

            This version will be released automatically when this PR is merged.`;
            } else {
              body = `${commentIdentifier}
            ## Version Preview

            | Current Version |
            |-----------------|
            | \`v${currentVersion}\` |

            [!] No version bump detected. This PR doesn't contain commits that trigger a release (e.g., \`feat:\`, \`fix:\`, \`perf:\`).`;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
